/* ============================================================
   BANNER CONTAINER  3030 × 1230 px  (including 15px bleed)
   ============================================================ */
.banner {
  position: relative;
  width: 3030px;
  height: 1230px;
  overflow: hidden;
  background: #0a1628;
  font-family: 'Mont', 'Montserrat', Arial, sans-serif;
}

/* ---- PORTRAIT ---- */
.portrait-zone {
  position: absolute;
  left: 0;
  top: 0;
  width: 1180px;
  height: 1230px;
  overflow: hidden;
}
.portrait-img {
  position: absolute;
  left: 0;
  top: 0;
  width: 1133px;
  height: 1230px;
  object-fit: cover;
  object-position: 50% 8%;
}
/* Fade the RIGHT edge of portrait into navy background */
.portrait-fade-right {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(to right,
    rgba(10,22,40,0.00)  0%,
    rgba(10,22,40,0.00) 48%,
    rgba(10,22,40,0.30) 58%,
    rgba(10,22,40,0.72) 72%,
    rgba(10,22,40,0.95) 85%,
    rgba(10,22,40,1.00) 95%
  );
}
/* Darken the TOP of portrait (gray studio bg above head) */
.portrait-fade-top {
  position: absolute;
  top: 0; left: 0; right: 0; height: 280px;
  background: linear-gradient(to bottom,
    rgba(10,22,40,1.00)  0%,
    rgba(10,22,40,0.70) 35%,
    rgba(10,22,40,0.00) 100%
  );
}
/* Subtle darkening of portrait bottom */
.portrait-fade-bottom {
  position: absolute;
  bottom: 0; left: 0; right: 0; height: 200px;
  background: linear-gradient(to top,
    rgba(10,22,40,0.85)  0%,
    rgba(10,22,40,0.00) 100%
  );
}

/* ---- DIAGONAL TEAL ACCENT (between portrait and content) ---- */
.diagonal-accent-1 {
  position: absolute;
  left: 1000px;
  top: -80px;
  width: 6px;
  height: 1450px;
  background: linear-gradient(to bottom,
    rgba(26,188,188,0.00)  0%,
    rgba(26,188,188,0.55) 12%,
    rgba(26,188,188,0.55) 88%,
    rgba(26,188,188,0.00) 100%
  );
  transform: rotate(-7deg);
  transform-origin: top center;
}
.diagonal-accent-2 {
  position: absolute;
  left: 1020px;
  top: -80px;
  width: 3px;
  height: 1450px;
  background: linear-gradient(to bottom,
    rgba(26,188,188,0.00)  0%,
    rgba(26,188,188,0.25) 12%,
    rgba(26,188,188,0.25) 88%,
    rgba(26,188,188,0.00) 100%
  );
  transform: rotate(-7deg);
  transform-origin: top center;
}

/* ---- CONTENT ZONE ---- */
.content-zone {
  position: absolute;
  left: 1060px;
  top: 0;
  width: 1955px;
  height: 1230px;
}

/* LOGO + BRAND NAME */
.brand-block {
  position: absolute;
  top: 58px;
  left: 14px;
  display: flex;
  align-items: center;
  gap: 28px;
}
.logo-img {
  width: 150px;
  height: 150px;
  flex-shrink: 0;
}
.brand-text-wrap {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
}
.brand-name {
  font-family: 'Mont','Montserrat',Arial,sans-serif;
  font-weight: 800;
  font-size: 50px;
  color: #ffffff;
  letter-spacing: 3px;
  text-transform: uppercase;
  line-height: 1.05;
}
.brand-sub {
  font-family: 'OS','Open Sans',Arial,sans-serif;
  font-weight: 400;
  font-size: 30px;
  color: #1abcbc;
  letter-spacing: 5px;
  text-transform: uppercase;
}

/* TEAL HORIZONTAL RULE after brand */
.brand-rule {
  position: absolute;
  top: 238px;
  left: 14px;
  right: 60px;
  height: 3px;
  background: linear-gradient(to right, #1abcbc, rgba(26,188,188,0.0));
}

/* MAIN HEADLINE */
.headline-zone {
  position: absolute;
  top: 262px;
  left: 14px;
  right: 40px;
}
.hl-eyebrow {
  font-family: 'OS','Open Sans',Arial,sans-serif;
  font-weight: 600;
  font-size: 38px;
  color: #1abcbc;
  letter-spacing: 7px;
  text-transform: uppercase;
  margin-bottom: 20px;
}
.hl-main {
  font-family: 'Mont','Montserrat',Arial,sans-serif;
  font-weight: 800;
  font-size: 152px;
  color: #ffffff;
  line-height: 0.90;
  letter-spacing: -2px;
  text-transform: uppercase;
  margin-bottom: 0px;
}
.hl-main .teal { color: #1abcbc; }
.hl-sub {
  font-family: 'Mont','Montserrat',Arial,sans-serif;
  font-weight: 800;
  font-size: 114px;
  color: #ffffff;
  line-height: 0.92;
  letter-spacing: -1px;
  text-transform: uppercase;
  margin-bottom: 24px;
}
.hl-sub .teal { color: #1abcbc; }
.hl-tagline {
  font-family: 'Mont','Montserrat',Arial,sans-serif;
  font-weight: 700;
  font-size: 56px;
  color: #c8d8e8;
  letter-spacing: 1px;
  line-height: 1.2;
}

/* CONTACT ZONE */
.contact-zone {
  position: absolute;
  bottom: 80px;
  left: 14px;
  right: 40px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.contact-row {
  display: flex;
  align-items: center;
  gap: 22px;
}
.contact-icon {
  width: 52px;
  height: 52px;
  flex-shrink: 0;
}
.contact-text {
  font-family: 'Mont','Montserrat',Arial,sans-serif;
  font-weight: 700;
  font-size: 50px;
  color: #ffffff;
  letter-spacing: 0.5px;
  line-height: 1;
}

/* QR + Tagline block, right side of contact zone */
.qr-block {
  position: absolute;
  bottom: 56px;
  right: 52px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
.qr-img {
  width: 200px;
  height: 200px;
  border: 6px solid white;
  border-radius: 12px;
  background: white;
  padding: 4px;
}
.qr-label {
  font-family: 'OS','Open Sans',Arial,sans-serif;
  font-weight: 600;
  font-size: 24px;
  color: #c8d8e8;
  letter-spacing: 2px;
  text-align: center;
}

/* ---- TEAL GEOMETRIC ACCENTS ---- */

/* Left bleed bar */
.left-bar {
  position: absolute;
  left: 0; top: 0;
  width: 15px; height: 1230px;
  background: #1abcbc;
}

/* Bottom bar */
.bottom-bar {
  position: absolute;
  left: 0; bottom: 0;
  width: 3030px; height: 42px;
  background: linear-gradient(to right, #0d8eaa, #1abcbc 30%, #1abcbc 70%, #0d8eaa);
}

/* Top-left corner teal dot accent */
.corner-tl {
  position: absolute;
  left: 15px; top: 15px;
  width: 60px; height: 60px;
  border-top: 5px solid #1abcbc;
  border-left: 5px solid #1abcbc;
}

/* Bottom-right teal bracket in content area */
.corner-br {
  position: absolute;
  right: 15px; bottom: 42px;
  width: 60px; height: 60px;
  border-bottom: 5px solid #1abcbc;
  border-right: 5px solid #1abcbc;
}

/* CROP MARKS */
.crop {
  position: absolute;
  background: rgba(0,0,0,0.4);
}
/* top-left */
.cm-tl-h { left:0; top:15px; width:10px; height:1px; }
.cm-tl-v { left:15px; top:0; width:1px; height:10px; }
/* top-right */
.cm-tr-h { right:0; top:15px; width:10px; height:1px; }
.cm-tr-v { right:15px; top:0; width:1px; height:10px; }
/* bottom-left */
.cm-bl-h { left:0; bottom:15px; width:10px; height:1px; }
.cm-bl-v { left:15px; bottom:0; width:1px; height:10px; }
/* bottom-right */
.cm-br-h { right:0; bottom:15px; width:10px; height:1px; }
.cm-br-v { right:15px; bottom:0; width:1px; height:10px; }

</style>
</head>

<div class="banner">
